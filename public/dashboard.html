<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner dashboard | UnityWebWorks</title>
<link rel="icon" href="/images/uww-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #14213D;
    --orange: #FF6A1F;
    --amber: #FFA55C;
    --slate: #6B7280;
    --pale-orange: #FFE4D1;
    --cloud: #F8F8F8;
    --white: #FFFFFF;
    --green: #16A34A;
    --red: #DC2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Lato', sans-serif;
    background: var(--cloud);
    color: var(--navy);
    min-height: 100vh;
  }
  .page { max-width: 1040px; margin: 0 auto; padding: 24px 20px 60px; }
  .topbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .topbar img { height: 26px; width: auto; }
  .topbar h1 {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1.15rem;
    margin: 0 0 0 4px;
    color: var(--navy);
  }
  .topbar .spacer { flex: 1; }
  #refresh {
    padding: 9px 18px;
    border-radius: 8px;
    border: 1.5px solid var(--navy);
    background: var(--white);
    color: var(--navy);
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #refresh:hover { background: var(--navy); color: var(--white); }
  .day-nav-btn {
    width: 34px; height: 34px; border-radius: 7px; border: 1.5px solid #E5E7EB;
    background: var(--white); color: var(--navy); font-family: 'Poppins', sans-serif;
    font-weight: 600; font-size: 0.85rem; cursor: pointer;
  }
  .day-nav-btn:hover { background: var(--cloud); }
  .day-slot {
    display: flex; align-items: center; gap: 12px; padding: 9px 14px;
    font-size: 0.85rem; background: var(--white); border-bottom: 1px solid #F1F2F5;
  }
  .day-slot:last-child { border-bottom: none; }
  .day-slot .slot-time { width: 70px; flex-shrink: 0; font-family: 'Poppins', sans-serif; font-weight: 600; color: var(--slate); }
  .day-slot.booked { background: var(--pale-orange); }
  .day-slot .slot-info strong { color: var(--navy); }
  .day-slot .slot-info span { color: var(--slate); font-size: 0.78rem; }
  .day-slot .slot-free { color: #C7CCD4; }
  #logout {
    padding: 9px 16px;
    border-radius: 8px;
    border: 1.5px solid #E5E7EB;
    background: var(--white);
    color: var(--slate);
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
  }
  #logout:hover { border-color: var(--red); color: var(--red); }
  .biz-name { color: var(--slate); font-weight: 400; }
  .table-card {
    background: var(--white);
    border-radius: 12px;
    box-shadow: 0 1px 3px rgba(20, 33, 61, 0.08), 0 8px 24px rgba(20, 33, 61, 0.06);
    overflow: hidden;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    padding: 14px 16px;
    font-family: 'Poppins', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--slate);
    background: var(--cloud);
    border-bottom: 1.5px solid #EEF0F3;
  }
  tbody td {
    padding: 14px 16px;
    font-size: 0.88rem;
    border-bottom: 1px solid #F1F2F5;
    vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #FBFBFC; }
  .pill {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    font-family: 'Poppins', sans-serif;
  }
  .pill-booking_confirmed { background: #DCFCE7; color: var(--green); }
  .pill-appointment_reminder { background: #FEF3C7; color: #B45309; }
  .pill-booking_completed { background: #E5E7EB; color: var(--navy); }
  .pill-booking_cancelled { background: #FEE2E2; color: var(--red); }
  .pill-cancellation_requested { background: var(--pale-orange); color: #B23E06; }
  select {
    padding: 7px 10px;
    border-radius: 7px;
    border: 1.5px solid #E5E7EB;
    background: var(--white);
    font-family: 'Lato', sans-serif;
    font-size: 0.85rem;
    color: var(--navy);
  }
  .approve-btn, .reject-btn {
    border: none;
    border-radius: 7px;
    padding: 7px 12px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 0.78rem;
    cursor: pointer;
    margin-right: 6px;
  }
  .approve-btn { background: var(--green); color: var(--white); }
  .approve-btn:hover { background: #15803D; }
  .reject-btn { background: var(--pale-orange); color: #B23E06; }
  .reject-btn:hover { background: #FFD4B3; }
  .empty-state {
    padding: 40px 16px;
    text-align: center;
    color: var(--slate);
    font-size: 0.9rem;
  }
  footer {
    text-align: center;
    margin-top: 24px;
    font-size: 0.75rem;
    color: var(--slate);
  }
  footer a { color: var(--orange); text-decoration: none; font-weight: 600; }
  @media (max-width: 720px) {
    table { display: block; overflow-x: auto; white-space: nowrap; }
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 10px;
    margin-bottom: 20px;
  }
  .stat-tile {
    background: var(--white);
    border-radius: 10px;
    padding: 16px 14px;
    box-shadow: 0 1px 3px rgba(20, 33, 61, 0.06);
    text-align: center;
  }
  .stat-tile .num { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 1.4rem; color: var(--orange); }
  .stat-tile .label { font-size: 0.72rem; color: var(--slate); margin-top: 2px; }
  .top-service-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 6px 0; border-bottom: 1px solid #F1F2F5; }
  .top-service-row:last-child { border-bottom: none; }
</style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <img src="/images/uww-logo-header.png" alt="UnityWebWorks">
      <h1>&middot; Owner dashboard <span class="biz-name" id="bizName"></span></h1>
      <div class="spacer"></div>
      <button id="refresh">Refresh</button>
      <button id="logout">Log out</button>
    </div>

    <div class="stats-grid" id="statsGrid"></div>

    <div class="table-card" style="margin-bottom:20px; padding:20px; display:flex; gap:24px; flex-wrap:wrap;">
      <div style="flex:1; min-width:200px;">
        <h2 style="font-family:'Poppins',sans-serif; font-size:0.9rem; margin:0 0 8px;">By status</h2>
        <div id="statusBreakdown"></div>
      </div>
      <div style="flex:1; min-width:200px;">
        <h2 style="font-family:'Poppins',sans-serif; font-size:0.9rem; margin:0 0 8px;">Top services</h2>
        <div id="topServices"></div>
      </div>
    </div>

    <div class="table-card" style="margin-bottom:20px; padding:20px;">
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;">
        <h2 style="font-family:'Poppins',sans-serif; font-size:1rem; margin:0;">Day schedule</h2>
        <div style="margin-left:auto; display:flex; gap:8px; align-items:center;">
          <button id="dayPrev" class="day-nav-btn">&larr;</button>
          <input type="date" id="dayDate" style="padding:7px 10px; border-radius:7px; border:1.5px solid #E5E7EB; font-family:'Lato',sans-serif;">
          <button id="dayNext" class="day-nav-btn">&rarr;</button>
          <button id="dayToday" class="day-nav-btn" style="width:auto; padding:0 12px;">Today</button>
        </div>
      </div>
      <div id="daySchedule" style="display:flex; flex-direction:column; gap:1px; max-height:360px; overflow-y:auto; border:1px solid #EEF0F3; border-radius:8px;"></div>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr><th>Customer</th><th>Phone</th><th>Time</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="table-card" style="margin-top:20px; padding:20px;">
      <h2 style="font-family:'Poppins',sans-serif; font-size:1rem; margin:0 0 4px;">Services</h2>
      <p style="font-size:0.82rem; color:var(--slate); margin:0 0 14px;">Add the services customers can choose when booking. Leave empty to hide the service picker on your booking page.</p>
      <div id="servicesList" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px;"></div>
      <form id="serviceForm" style="display:flex; gap:8px; flex-wrap:wrap;">
        <input type="text" id="serviceName" placeholder="Service name, e.g. Haircut" required style="flex:1; min-width:160px; padding:9px 12px; border-radius:7px; border:1.5px solid #E5E7EB; font-family:'Lato',sans-serif;">
        <input type="text" id="servicePrice" placeholder="Price (optional), e.g. ₹500" style="flex:1; min-width:140px; padding:9px 12px; border-radius:7px; border:1.5px solid #E5E7EB; font-family:'Lato',sans-serif;">
        <button type="submit" style="padding:9px 18px; border-radius:7px; border:none; background:var(--orange); color:var(--navy); font-family:'Poppins',sans-serif; font-weight:600; font-size:0.85rem; cursor:pointer;">Add</button>
      </form>
    </div>

    <footer>
      Powered by <a href="https://unitywebworks.com" target="_blank" rel="noopener">UnityWebWorks</a>
    </footer>
  </div>

  <script>
    const STATUSES = ["booking_confirmed", "appointment_reminder", "booking_completed", "booking_cancelled"];
    const rows = document.getElementById("rows");
    const bizName = document.getElementById("bizName");

    async function checkAuth() {
      const res = await fetch("/api/me");
      if (!res.ok) {
        window.location.href = "/login.html";
        return false;
      }
      const me = await res.json();
      bizName.textContent = `(${me.business_name})`;
      return true;
    }

    document.getElementById("logout").addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" });
      window.location.href = "/login.html";
    });

    // ---------- Analytics ----------
    const statsGrid = document.getElementById("statsGrid");
    const STATUS_LABELS = {
      booking_confirmed: "Confirmed", appointment_reminder: "Reminded",
      booking_completed: "Completed", booking_cancelled: "Cancelled", cancellation_requested: "Pending cancel"
    };

    async function loadAnalytics() {
      const res = await fetch("/api/dashboard/analytics");
      if (res.status === 401) { window.location.href = "/login.html"; return; }
      const a = await res.json();

      statsGrid.innerHTML = `
        <div class="stat-tile"><div class="num">${a.total}</div><div class="label">All-time bookings</div></div>
        <div class="stat-tile"><div class="num">${a.last_7_days}</div><div class="label">Last 7 days</div></div>
        <div class="stat-tile"><div class="num">${a.last_30_days}</div><div class="label">Last 30 days</div></div>
        <div class="stat-tile"><div class="num">${a.by_status.booking_cancelled || 0}</div><div class="label">Cancelled</div></div>
      `;

      const statusBreakdown = document.getElementById("statusBreakdown");
      statusBreakdown.innerHTML = Object.entries(a.by_status).map(([key, count]) =>
        `<div class="top-service-row"><span>${STATUS_LABELS[key] || key}</span><strong>${count}</strong></div>`
      ).join("");

      const topServices = document.getElementById("topServices");
      if (a.top_services.length === 0) {
        topServices.innerHTML = '<div style="font-size:0.82rem; color:var(--slate);">No service data yet.</div>';
      } else {
        topServices.innerHTML = a.top_services.map((s) =>
          `<div class="top-service-row"><span>${s.name}</span><strong>${s.count}</strong></div>`
        ).join("");
      }
    }

    // ---------- Day schedule ----------
    const dayDate = document.getElementById("dayDate");
    const daySchedule = document.getElementById("daySchedule");

    function toDateStr(d) { return d.toISOString().slice(0, 10); }
    dayDate.value = toDateStr(new Date());

    async function loadDaySchedule() {
      daySchedule.innerHTML = '<div class="day-slot">Loading...</div>';
      const res = await fetch(`/api/dashboard/day-schedule?date=${encodeURIComponent(dayDate.value)}`);
      if (res.status === 401) { window.location.href = "/login.html"; return; }
      const slots = await res.json();
      daySchedule.innerHTML = "";

      if (!Array.isArray(slots) || slots.length === 0) {
        daySchedule.innerHTML = '<div class="day-slot">No working hours set for this business.</div>';
        return;
      }

      slots.forEach((slot) => {
        const row = document.createElement("div");
        row.className = "day-slot" + (slot.bookings.length > 0 ? " booked" : "");
        if (slot.bookings.length === 0) {
          row.innerHTML = `<span class="slot-time">${slot.time12}</span><span class="slot-free">&mdash; free &mdash;</span>`;
        } else {
          const info = slot.bookings.map((b) =>
            `<div class="slot-info"><strong>${b.customer_name}</strong>${b.service_name ? ` &middot; ${b.service_name}` : ""} <span>${b.customer_phone}</span></div>`
          ).join("");
          row.innerHTML = `<span class="slot-time">${slot.time12}</span>${info}`;
        }
        daySchedule.appendChild(row);
      });
    }

    dayDate.addEventListener("change", loadDaySchedule);
    document.getElementById("dayPrev").addEventListener("click", () => {
      const d = new Date(dayDate.value); d.setDate(d.getDate() - 1);
      dayDate.value = toDateStr(d); loadDaySchedule();
    });
    document.getElementById("dayNext").addEventListener("click", () => {
      const d = new Date(dayDate.value); d.setDate(d.getDate() + 1);
      dayDate.value = toDateStr(d); loadDaySchedule();
    });
    document.getElementById("dayToday").addEventListener("click", () => {
      dayDate.value = toDateStr(new Date()); loadDaySchedule();
    });

    const servicesList = document.getElementById("servicesList");
    const serviceForm = document.getElementById("serviceForm");

    async function loadServices() {
      const res = await fetch("/api/dashboard/services");
      const services = await res.json();
      servicesList.innerHTML = "";

      if (services.length === 0) {
        servicesList.innerHTML = '<span style="font-size:0.82rem; color:var(--slate);">No services added yet.</span>';
        return;
      }

      services.forEach((s) => {
        const pill = document.createElement("span");
        pill.style.cssText = "display:inline-flex; align-items:center; gap:6px; background:var(--cloud); border:1.5px solid #E5E7EB; border-radius:20px; padding:6px 10px 6px 12px; font-size:0.82rem;";
        pill.innerHTML = `<span>${s.name}${s.price ? ` &middot; ${s.price}` : ""}</span>`;
        const delBtn = document.createElement("button");
        delBtn.textContent = "×";
        delBtn.style.cssText = "border:none; background:none; color:var(--red); font-size:1rem; cursor:pointer; line-height:1; padding:0;";
        delBtn.addEventListener("click", async () => {
          await fetch(`/api/dashboard/services/${s.id}`, { method: "DELETE" });
          loadServices();
        });
        pill.appendChild(delBtn);
        servicesList.appendChild(pill);
      });
    }

    serviceForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("serviceName").value.trim();
      const price = document.getElementById("servicePrice").value.trim();
      if (!name) return;

      await fetch("/api/dashboard/services", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, price })
      });
      serviceForm.reset();
      loadServices();
    });

    async function load() {
      const res = await fetch("/api/dashboard/bookings");
      if (res.status === 401) {
        window.location.href = "/login.html";
        return;
      }
      const bookings = await res.json();
      rows.innerHTML = "";

      if (bookings.length === 0) {
        rows.innerHTML = '<tr><td colspan="5" class="empty-state">No bookings yet.</td></tr>';
        return;
      }

      bookings.forEach((b) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${b.customer_name}${b.service_name ? `<br><span style="color:var(--orange); font-size:0.78rem; font-weight:600;">${b.service_name}</span>` : ""}</td>
          <td>${b.customer_phone}${b.customer_email ? `<br><span style="color:var(--slate); font-size:0.78rem;">${b.customer_email}</span>` : ""}</td>
          <td>${b.appointment_time}</td>
          <td><span class="pill pill-${b.status}">${b.status.replace(/_/g, " ")}</span></td>
        `;
        const actionTd = document.createElement("td");

        if (b.status === "cancellation_requested") {
          const approveBtn = document.createElement("button");
          approveBtn.className = "approve-btn";
          approveBtn.textContent = "Approve";
          approveBtn.addEventListener("click", async () => {
            await fetch(`/api/dashboard/bookings/${b._id}/approve-cancellation`, { method: "PATCH" });
            load();
          });

          const rejectBtn = document.createElement("button");
          rejectBtn.className = "reject-btn";
          rejectBtn.textContent = "Keep booking";
          rejectBtn.addEventListener("click", async () => {
            await fetch(`/api/dashboard/bookings/${b._id}/reject-cancellation`, { method: "PATCH" });
            load();
          });

          actionTd.appendChild(approveBtn);
          actionTd.appendChild(rejectBtn);
        } else {
          const select = document.createElement("select");
          STATUSES.forEach((s) => {
            const opt = document.createElement("option");
            opt.value = s;
            opt.textContent = s.replace(/_/g, " ");
            if (s === b.status) opt.selected = true;
            select.appendChild(opt);
          });
          select.addEventListener("change", async () => {
            await fetch(`/api/dashboard/bookings/${b._id}/status`, {
              method: "PATCH",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ status: select.value })
            });
            load();
          });
          actionTd.appendChild(select);
        }

        tr.appendChild(actionTd);
        rows.appendChild(tr);
      });
    }

    document.getElementById("refresh").addEventListener("click", load);
    checkAuth().then((ok) => { if (ok) { load(); loadServices(); loadDaySchedule(); loadAnalytics(); } });
  </script>
</body>
</html>
