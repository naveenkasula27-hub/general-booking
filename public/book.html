<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book an appointment</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.4rem; }
  label { display: block; margin-top: 16px; font-weight: 600; }
  input { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
  button { margin-top: 24px; width: 100%; padding: 12px; background: #1b1b1b; color: #fff; border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }
  #msg { margin-top: 16px; font-weight: 600; }
</style>
</head>
<body>
  <h1>Book an appointment</h1>
  <form id="bookingForm">
    <label>Your name
      <input type="text" name="customer_name" required>
    </label>
    <label>WhatsApp number (with country code)
      <input type="tel" name="customer_phone" placeholder="91XXXXXXXXXX" required>
    </label>
    <label>Preferred time
      <input type="text" name="appointment_time" placeholder="e.g. Tomorrow 5 PM" required>
    </label>
    <button type="submit">Book now</button>
  </form>
  <div id="msg"></div>

  <hr style="margin-top:32px">

  <h1>Need to cancel?</h1>
  <label>Your WhatsApp number
    <input type="tel" id="lookupPhone" placeholder="91XXXXXXXXXX">
  </label>
  <button type="button" id="findBtn">Find my booking</button>
  <div id="lookupResults"></div>

  <script>
    const form = document.getElementById("bookingForm");
    const msg = document.getElementById("msg");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(form).entries());
      msg.textContent = "Booking...";

      try {
        const res = await fetch("/api/bookings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error((await res.json()).error || "Failed");
        msg.textContent = "Booked! You'll get a WhatsApp confirmation shortly.";
        form.reset();
      } catch (err) {
        msg.textContent = "Could not book: " + err.message;
      }
    });

    const lookupPhone = document.getElementById("lookupPhone");
    const findBtn = document.getElementById("findBtn");
    const lookupResults = document.getElementById("lookupResults");

    findBtn.addEventListener("click", async () => {
      const phone = lookupPhone.value.trim();
      if (!phone) return;
      lookupResults.textContent = "Looking up...";

      const res = await fetch(`/api/bookings/by-phone/${encodeURIComponent(phone)}`);
      const bookings = await res.json();
      lookupResults.innerHTML = "";

      if (bookings.length === 0) {
        lookupResults.textContent = "No active bookings found for that number.";
        return;
      }

      bookings.forEach((b) => {
        const row = document.createElement("div");
        row.style.marginTop = "12px";
        row.style.padding = "10px";
        row.style.border = "1px solid #eee";
        row.style.borderRadius = "6px";

        if (b.status === "cancellation_requested") {
          row.innerHTML = `<div>${b.appointment_time}</div><div>Cancellation requested — waiting for the business to confirm.</div>`;
          lookupResults.appendChild(row);
          return;
        }

        row.innerHTML = `<div>${b.appointment_time}</div>`;
        const cancelBtn = document.createElement("button");
        cancelBtn.textContent = "Request cancellation";
        cancelBtn.style.marginTop = "8px";
        cancelBtn.addEventListener("click", async () => {
          cancelBtn.disabled = true;
          cancelBtn.textContent = "Requesting...";
          await fetch(`/api/bookings/${b._id}/request-cancellation`, { method: "POST" });
          findBtn.click();
        });
        row.appendChild(cancelBtn);
        lookupResults.appendChild(row);
      });
    });
  </script>
</body>
</html>
